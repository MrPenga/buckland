<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>IL CORVO — Il Bracconiere delle Wildlands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Pirata+One&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --nero: #080807;
      --pannello: #181713;
      --bordo: #484037;
      --inchiostro: #ded8ca;
      --sbiadito: #a79e90;
      --rosso: #8b3730;
      --rosso-luce: #ba574b;
      --oro: #c2a67d;
      --font-titolo: 'Pirata One', 'IM Fell English SC', Georgia, serif;
      --font-testo: 'Special Elite', 'Courier New', monospace;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--inchiostro);
      font-family: var(--font-testo);
      background:
        radial-gradient(ellipse at 49% -14%, #42312944 0%, transparent 52%),
        radial-gradient(circle at 90% 96%, #24170f 0%, transparent 34%),
        repeating-linear-gradient(90deg, #ffffff02 0 1px, transparent 1px 9px),
        var(--nero);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .14;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--rosso-luce); outline-offset: 2px; }
    .page { max-width: 1250px; padding: 21px 25px 32px; margin: 0 auto; }
    .top {
      position: relative;
      padding: 9px 20px 15px;
      margin-bottom: 17px;
      border-top: 1px solid #736252;
      border-bottom: 1px solid var(--bordo);
      text-align: center;
      background:
        linear-gradient(135deg, transparent 12%, #371d191b 12.3%, transparent 12.6%),
        repeating-linear-gradient(177deg, transparent 0 14px, #c5b7a205 15px 16px),
        #15130f;
      box-shadow: 0 8px 22px #0009, inset 0 0 0 4px #080807, inset 0 0 0 5px #342c25;
    }
    .crest { display: flex; justify-content: center; align-items: center; gap: clamp(2px, 1.5vw, 17px); }
    .skull {
      display: block;
      width: clamp(75px, 12vw, 155px);
      height: clamp(57px, 9vw, 117px);
      flex: 0 1 auto;
      overflow: visible;
      opacity: .92;
      filter: drop-shadow(2px 4px 3px #000) drop-shadow(0 0 6px #58251b55);
    }
    .skull { object-fit: contain; }
    .skull.right { transform: none; }
    .masthead {
      margin: 0;
      white-space: nowrap;
      font-family: var(--font-titolo);
      font-size: clamp(3.5rem, 8.2vw, 6.6rem);
      letter-spacing: .07em;
      line-height: .98;
      font-weight: 400;
      background: repeating-linear-gradient(174deg, #e5ded0 0px, #ddd4c5 3px, #7e766a 4px, #d2c8b6 5px, #ece4d5 10px, #83786c 11px, #d9d0c0 14px);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(3px 4px 0 #000);
    }
    .subtitle {
      margin-top: 1px;
      color: var(--rosso-luce);
      font-family: 'IM Fell English SC', Georgia, serif;
      text-transform: uppercase;
      font-size: .88rem;
      letter-spacing: .34em;
    }
    .missiva {
      margin-top: 7px;
      color: #c9b8a0;
      font-family: 'Special Elite', Georgia, serif;
      font-size: .78rem;
      letter-spacing: .17em;
      text-shadow: 1px 2px 2px #000;
    }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 268px; gap: 18px; align-items: start; }
    .listino, .conto {
      position: relative;
      min-width: 0;
      border: 1px solid var(--bordo);
      background:
        repeating-linear-gradient(-38deg, #ffffff02 0 1px, transparent 1px 7px),
        linear-gradient(135deg, #1e1c17, #12110f 70%);
      box-shadow: 6px 8px 0 #0008, inset 0 0 0 4px #0c0c0a;
    }
    .listino::before, .conto::before { content: ''; position: absolute; pointer-events: none; inset: 8px; border: 1px solid #74634b24; }
    .panel-head {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: baseline;
      padding: 14px 22px 11px;
      border-bottom: 1px solid #504537;
      background: linear-gradient(90deg, #08080861, transparent);
    }
    .panel-head h2, .conto h2 {
      margin: 0;
      font: 400 1.86rem/1 var(--font-titolo);
      letter-spacing: .06em;
      color: #e4dccc;
      text-shadow: 2px 2px 0 #070705, -1px 0 #625342;
    }
    .count { font-size: .65rem; letter-spacing: .13em; color: var(--sbiadito); }
    #catalogo { padding: 3px 14px 11px; }
    .articolo {
      display: grid;
      grid-template-columns: minmax(140px, 1.1fr) minmax(168px, 1.5fr) 101px;
      align-items: center;
      column-gap: 12px;
      padding: 8px 9px;
      min-height: 57px;
      border-bottom: 1px dashed #5a4b3b;
    }
    .articolo:last-child { border-bottom: none; }
    .descrizione { min-width: 0; }
    .nome {
      display: block;
      font: 400 1.13rem/1.1 'IM Fell English SC', Georgia, serif;
      text-transform: uppercase;
      letter-spacing: .025em;
      overflow-wrap: anywhere;
      color: #e2dacb;
      text-shadow: 1px 1px #070705;
    }
    .prezzo { display: block; margin-top: 3px; color: var(--oro); font-size: .71rem; font-variant-numeric: tabular-nums; }
    .stack-workspace { min-width: 0; display: flex; align-items: flex-start; gap: 6px; }
    .cubes { display: flex; min-width: 0; flex: 0 1 auto; flex-wrap: wrap; gap: 5px; }
    .quantita {
      flex: 0 0 48px;
      width: 48px;
      height: 30px;
      padding: 2px 3px 0;
      border: 1px solid #655340;
      border-radius: 0;
      background: #0d0d0b;
      box-shadow: inset 0 1px 4px #000a;
      color: #f1e7d7;
      text-align: center;
      font-size: .84rem;
      font-variant-numeric: tabular-nums;
      appearance: textfield;
      -moz-appearance: textfield;
    }
    .quantita::-webkit-outer-spin-button, .quantita::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .stack-actions { display: flex; flex: 0 0 auto; gap: 4px; }
    .qbtn {
      width: 29px;
      height: 30px;
      border: 1px solid #655340;
      color: #d6cbba;
      background: #242019;
      font-size: 1.14rem;
      line-height: 1;
      transition: background .15s ease, color .15s ease;
    }
    .qbtn:hover:not(:disabled) { background: #492a24; color: #fff; }
    .qbtn:disabled { cursor: not-allowed; color: #605a50; opacity: .62; }
    .parziale { min-width: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .parziale .piccolo { display: block; margin-bottom: 3px; color: #a3988a; font-size: .62rem; letter-spacing: .03em; }
    .somma { color: #e5dbcc; white-space: nowrap; font-size: .83rem; }
    .articolo.attivo .nome { color: #fff3e3; }
    .articolo.attivo .somma { color: #ddaa81; }
    .conto { padding: 20px 19px 18px; position: sticky; top: 20px; }
    .conto h2 { padding-bottom: 14px; border-bottom: 1px solid #60503e; }
    .riepilogo { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 19px 0 16px; }
    .riepilogo span { color: var(--sbiadito); font-size: .65rem; }
    .riepilogo strong { font: .95rem var(--font-testo); font-variant-numeric: tabular-nums; }
    .totale-wrap {
      padding: 18px 4px 20px;
      border-top: 1px dashed #604d3b;
      border-bottom: 1px dashed #604d3b;
      text-align: center;
      background: radial-gradient(ellipse at center, #6d241918, transparent 80%);
    }
    .totale-wrap .label { display: block; margin-bottom: 8px; font: 400 1rem 'IM Fell English SC', Georgia, serif; letter-spacing: .2em; color: #b8aa98; }
    #totale {
      display: block;
      color: #e7c3a8;
      font-family: 'IM Fell English SC', Georgia, serif;
      font-size: clamp(1.95rem, 2.8vw, 2.65rem);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
      text-shadow: 1px 1px #080807;
    }
    .azzera {
      display: block;
      width: 100%;
      margin-top: 16px;
      min-height: 40px;
      padding: 9px;
      background: #211714;
      border: 1px solid #7b3a32;
      color: #d4b8aa;
      text-transform: uppercase;
      font-size: .69rem;
      letter-spacing: .12em;
    }
    .azzera:hover:not(:disabled) { background: #4a251f; color: #fff1e5; }
    .azzera:disabled { opacity: .48; cursor: not-allowed; }
    .vuoto { text-align: center; color: var(--sbiadito); padding: 35px 12px; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .conto { position: static; }
    }
    @media (max-width: 620px) {
      .page { padding: 12px 10px 27px; }
      .top { padding: 12px 8px 15px; margin-bottom: 15px; }
      .crest { gap: 0; }
      .skull { width: clamp(40px, 13vw, 75px); height: 60px; }
      .masthead { font-size: clamp(2.3rem, 9vw, 4.7rem); letter-spacing: .02em; }
      .subtitle { font-size: .7rem; letter-spacing: .13em; }
      .panel-head { padding: 14px 16px 10px; }
      #catalogo { padding: 3px 9px 10px; }
      .articolo { grid-template-columns: minmax(0, 1fr) 95px; gap: 7px 10px; padding: 10px 6px; }
      .descrizione { grid-column: 1; }
      .stack-workspace { grid-column: 1; grid-row: 2; }
      .parziale { grid-column: 2; grid-row: 1 / 3; }
      .nome { font-size: 1.07rem; }
      .prezzo { font-size: .71rem; }
      .conto { padding: 19px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="crest">
        <img class="skull left" src="teschio-corvo-sx.png" alt="Teschio di corvo rivolto a sinistra">
        <h1 class="masthead">IL CORVO</h1>
        <img class="skull right" src="teschio-corvo-dx.png" alt="Teschio di corvo rivolto a destra">
      </div>
      <div class="subtitle">IL BRACCONIERE DELLE WILDLANDS</div>
      <div class="missiva">MISSIVA: YG950</div>
    </header>

    <div class="layout">
      <section class="listino" aria-labelledby="listino-title">
        <div class="panel-head">
          <h2 id="listino-title">La merce</h2>
          <span class="count" id="numero-articoli"></span>
        </div>
        <div id="catalogo"></div>
      </section>
      <aside class="conto" aria-labelledby="conto-title">
        <h2 id="conto-title">Il conto</h2>
        <div class="riepilogo"><span>PEZZI SELEZIONATI</span><strong id="pezzi">0</strong></div>
        <div class="totale-wrap"><span class="label">TOTALE</span><output id="totale" aria-live="polite">$0.00</output></div>
        <button class="azzera" type="button" id="azzera" disabled>✕ &nbsp; Azzera quantità</button>
      </aside>
    </div>
  </main>

  <script>
    'use strict';
    // Prezzi per singolo pezzo. Ogni casella corrisponde a uno stack indipendente.
    const CATALOGO = [
      { nome: 'Artigli Aquila', prezzo: 4.00 },
      { nome: 'Piume Aquila', prezzo: 6.00 },
      { nome: 'Pelliccia Wapiti', prezzo: 3.00 },
      { nome: 'Carne di Wapiti', prezzo: 2.00 },
      { nome: 'Pelliccia Bufalo', prezzo: 3.00 },
      { nome: 'Carne Bufalo', prezzo: 2.00 },
      { nome: 'Pelliccia di Alce', prezzo: 4.00 },
      { nome: 'Corna Alce', prezzo: 2.00 }
    ];
    const MAX_STACK = 99999;
    const MAX_CASELLE = 100;
    const stacks = CATALOGO.map(() => [0]);
    const prezziCentesimi = CATALOGO.map(({ prezzo }) => Math.round(prezzo * 100));
    const catalogoEl = document.getElementById('catalogo');
    const pezziEl = document.getElementById('pezzi');
    const totaleEl = document.getElementById('totale');
    const azzeraEl = document.getElementById('azzera');
    const soldi = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function numeroValido(valore) {
      const n = Number(valore);
      return Number.isFinite(n) && n > 0 ? Math.min(MAX_STACK, Math.trunc(n)) : 0;
    }

    function creaRiga(prodotto, indice) {
      const riga = document.createElement('div');
      riga.className = 'articolo';
      riga.dataset.indice = indice;
      const desc = document.createElement('div');
      desc.className = 'descrizione';
      const nome = document.createElement('span');
      nome.className = 'nome';
      nome.textContent = prodotto.nome;
      const prezzo = document.createElement('span');
      prezzo.className = 'prezzo';
      prezzo.textContent = soldi(prezziCentesimi[indice] / 100) + ' / pz';
      desc.append(nome, prezzo);

      const workspace = document.createElement('div');
      workspace.className = 'stack-workspace';
      const cubes = document.createElement('div');
      cubes.className = 'cubes';
      const actions = document.createElement('div');
      actions.className = 'stack-actions';
      for (const [azione, segno, label] of [
        ['meno', '−', 'Rimuovi ultimo stack'],
        ['piu', '+', 'Aggiungi uno stack']
      ]) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'qbtn';
        btn.dataset.azione = azione;
        btn.textContent = segno;
        btn.title = label;
        btn.setAttribute('aria-label', label + ': ' + prodotto.nome);
        actions.append(btn);
      }
      workspace.append(cubes, actions);

      const parziale = document.createElement('div');
      parziale.className = 'parziale';
      const dettagli = document.createElement('span');
      dettagli.className = 'piccolo';
      dettagli.textContent = 'QTÀ 0';
      const importo = document.createElement('span');
      importo.className = 'somma';
      importo.textContent = soldi(0);
      parziale.append(dettagli, importo);
      riga.append(desc, workspace, parziale);
      return riga;
    }

    function disegnaStack(indice, focusUltimo = false) {
      const riga = catalogoEl.querySelector(`.articolo[data-indice="${indice}"]`);
      const contenitore = riga.querySelector('.cubes');
      contenitore.replaceChildren();
      stacks[indice].forEach((valore, pos) => {
        const input = document.createElement('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.className = 'quantita';
        input.min = '0';
        input.max = String(MAX_STACK);
        input.step = '1';
        input.dataset.stack = pos;
        input.value = valore || '';
        input.placeholder = '0';
        input.title = `Stack ${pos + 1}: ${CATALOGO[indice].nome}`;
        input.setAttribute('aria-label', `Quantità stack ${pos + 1} di ${CATALOGO[indice].nome}`);
        contenitore.append(input);
      });
      riga.querySelector('[data-azione="meno"]').disabled = stacks[indice].length === 1 && !stacks[indice][0];
      riga.querySelector('[data-azione="piu"]').disabled = stacks[indice].length >= MAX_CASELLE;
      if (focusUltimo) {
        const ultimo = contenitore.lastElementChild;
        if (ultimo) ultimo.focus();
      }
    }

    function aggiornaTotali() {
      let centesimi = 0;
      let pezzi = 0;
      for (const [indice, riga] of catalogoEl.querySelectorAll('.articolo').entries()) {
        const q = stacks[indice].reduce((somma, n) => somma + n, 0);
        const subtotale = prezziCentesimi[indice] * q;
        centesimi += subtotale;
        pezzi += q;
        riga.classList.toggle('attivo', q > 0);
        riga.querySelector('.piccolo').textContent = 'QTÀ ' + q.toLocaleString('it-IT');
        riga.querySelector('.somma').textContent = soldi(subtotale / 100);
        riga.querySelector('[data-azione="meno"]').disabled = stacks[indice].length === 1 && !q;
        riga.querySelector('[data-azione="piu"]').disabled = stacks[indice].length >= MAX_CASELLE;
      }
      pezziEl.textContent = pezzi.toLocaleString('it-IT');
      totaleEl.textContent = soldi(centesimi / 100);
      azzeraEl.disabled = pezzi === 0 && stacks.every(s => s.length === 1);
    }

    catalogoEl.addEventListener('click', (evento) => {
      const pulsante = evento.target.closest('button[data-azione]');
      if (!pulsante) return;
      const indice = Number(pulsante.closest('.articolo').dataset.indice);
      if (pulsante.dataset.azione === 'piu') {
        if (stacks[indice].length >= MAX_CASELLE) return;
        stacks[indice].push(0);
        disegnaStack(indice, true);
      } else {
        if (stacks[indice].length > 1) stacks[indice].pop();
        else stacks[indice][0] = 0;
        disegnaStack(indice);
      }
      aggiornaTotali();
    });

    catalogoEl.addEventListener('input', (evento) => {
      if (!evento.target.matches('input.quantita')) return;
      const indice = Number(evento.target.closest('.articolo').dataset.indice);
      const pos = Number(evento.target.dataset.stack);
      const numero = numeroValido(evento.target.value);
      stacks[indice][pos] = numero;
      if (Number(evento.target.value) > MAX_STACK || Number(evento.target.value) < 0) evento.target.value = numero || '';
      aggiornaTotali();
    });

    catalogoEl.addEventListener('change', (evento) => {
      if (!evento.target.matches('input.quantita')) return;
      const indice = Number(evento.target.closest('.articolo').dataset.indice);
      const pos = Number(evento.target.dataset.stack);
      stacks[indice][pos] = numeroValido(evento.target.value);
      evento.target.value = stacks[indice][pos] || '';
      aggiornaTotali();
    });

    azzeraEl.addEventListener('click', () => {
      stacks.forEach((_, i) => { stacks[i] = [0]; disegnaStack(i); });
      aggiornaTotali();
    });

    document.getElementById('numero-articoli').textContent = CATALOGO.length + ' ARTICOLI';
    if (CATALOGO.length) {
      catalogoEl.append(...CATALOGO.map(creaRiga));
      stacks.forEach((_, i) => disegnaStack(i));
    } else {
      const vuoto = document.createElement('p');
      vuoto.className = 'vuoto';
      vuoto.textContent = 'Nessuna merce nel listino.';
      catalogoEl.append(vuoto);
    }
    aggiornaTotali();
  </script>
</body>
</html>
